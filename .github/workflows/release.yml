name: Release add-on

# Tag as <addon-dir>-v<version>, e.g. `monzo-v2.0.0`, `revolut-v2.0.1`,
# `trading212-v2.1.0`. The version must match that add-on's manifest.json.
on:
  push:
    tags:
      - "*-v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g. revolut-v2.0.0)"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Resolve add-on from tag
        id: tag
        env:
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          addon="${TAG%-v*}"
          version="${TAG##*-v}"
          test -f "addons/$addon/manifest.json" || { echo "No add-on at addons/$addon"; exit 1; }
          manifest_version=$(node -p "require('./addons/$addon/manifest.json').version")
          [ "$manifest_version" = "$version" ] || { echo "Tag $version != manifest $manifest_version"; exit 1; }
          echo "addon=$addon" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter "./addons/${{ steps.tag.outputs.addon }}" --filter @wf-addons/kit test
      - run: pnpm --filter "./addons/${{ steps.tag.outputs.addon }}" type-check
      - run: pnpm --filter "./addons/${{ steps.tag.outputs.addon }}" bundle
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: ${{ steps.tag.outputs.tag }}
          files: addons/${{ steps.tag.outputs.addon }}/dist/*.zip
          generate_release_notes: true
