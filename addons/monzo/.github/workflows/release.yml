name: Release Addon

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. v1.0.0)'
        required: true
        default: 'v1.0.0'
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        working-directory: addon
        run: npm install

      - name: Build addon
        working-directory: addon
        run: npm run build

      - name: Create ZIP
        working-directory: addon
        run: zip -j monzo-addon.zip manifest.json dist/addon.js

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.version || github.ref_name }}
          name: Monzo Addon ${{ github.event.inputs.version || github.ref_name }}
          files: addon/monzo-addon.zip
          body: |
            ## Monzo Bank Sync Addon for Wealthfolio

            ### Installation
            1. Download `monzo-addon.zip` below
            2. In Wealthfolio → Settings → Add-ons → Install from ZIP
            3. Set up the proxy and configure the addon (see [README](https://github.com/dpremoli/MonzoAddOn#readme))

            ### What's included
            - `manifest.json` — addon metadata and permissions
            - `dist/addon.js` — compiled addon bundle

            ### Requirements
            - Wealthfolio 3.3.0+
            - Monzo Proxy running (see README for Unraid setup)
          generate_release_notes: true
