name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm type-check
      - run: pnpm test
      - run: pnpm test:tooling
      - run: pnpm bundle
      - name: Release preview
        run: pnpm release:plan
      - uses: actions/upload-artifact@v4
        with:
          name: addon-zips
          path: addons/*/dist/*.zip
          if-no-files-found: error
